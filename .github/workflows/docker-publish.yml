name: Test and Publish

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools the suite drives
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inotify-tools shellcheck

      - name: Create a virtual environment
        run: python3 -m venv .venv

      - name: Install test dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Install Chromium for the browser tests
        run: .venv/bin/playwright install --with-deps chromium

      - name: Lint
        run: |
          shellcheck watcher.sh new-page.sh tests/smoke.sh
          python3 -m py_compile generator.py new-page.py

      - name: Run the suite
        env:
          REQUIRE_BROWSER_TESTS: "1"
        run: .venv/bin/pytest -q

  smoke:
    name: Boot the image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t site-filebrowser:ci .

      - name: Serve a tree and check the runtime contract
        run: bash tests/smoke.sh site-filebrowser:ci

  build:
    name: Publish to ghcr.io
    needs: [ test, smoke ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        # ghcr.io rejects uppercase, and github.repository keeps its case
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # A pull request from a fork has no packages:write, so pushing there
          # fails the job; same-repo PRs would only add a pr-* tag.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
