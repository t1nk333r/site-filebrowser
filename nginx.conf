user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    server {
        listen 80;
        server_name localhost;
        root /var/www/html;
        
        # Disable directory listing (we generate our own)
        autoindex off;
        
        # Set charset
        charset utf-8;
        
        # Never advertise the server version
        server_tokens off;
        
        # Content is served as the unprivileged nginx user, so a symlink pointing
        # at something owned by somebody else (a container file, say) is not followed
        disable_symlinks if_not_owner from=$document_root;
        
        # Security headers. Any location that defines its own add_header has to
        # repeat this whole set: nginx drops inherited headers as soon as one is
        # defined, which tests/test_nginx_config.py enforces.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        # Inline script and style are part of the design (the theme toggle, the
        # listing styles, onload handlers), so both keep 'unsafe-inline'. eval is
        # still blocked, and everything external falls back to 'self'. Tighten
        # script-src with hashes if you never write inline markup of your own.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        
        # Prevent access to hidden files and directories
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Prevent access to backup files (editor leftovers, copies, droppings)
        location ~ (~|\.(bak|old|orig|save|swp|swo|tmp))$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Block common exploit attempts
        location ~* "(eval\(|base64_decode|gzip_inflate)" {
            deny all;
        }
        
        # Limit allowed file extensions (optional - comment out if too restrictive)
        # location ~ \.(php|py|sh|exe|bat|cmd)$ {
        #     deny all;
        # }
        
        # Default index files
        index index.html;
        
        # Liveness probe, also used by the image's HEALTHCHECK
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        
        location / {
            # nginx normalises the request path before matching it, so a '..'
            # cannot walk out of the document root
            try_files $uri $uri/ $uri/index.html =404;
        }
        
        # Cache static files. Neither location sets an add_header on purpose:
        # nginx discards every inherited add_header as soon as a location defines
        # one, which would silently drop the security headers set above.
        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
        }
        
        # Stylesheets and scripts are edited in place, so they must stay
        # revalidatable instead of being pinned in browsers for a year.
        location ~* \.(css|js)$ {
            expires 1h;
        }
    }
}
