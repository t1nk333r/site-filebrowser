user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    server {
        listen 80;
        server_name localhost;
        root /var/www/html;
        
        # Disable directory listing (we generate our own)
        autoindex off;
        
        # Set charset
        charset utf-8;
        
        # Never advertise the server version
        server_tokens off;
        
        # Content is served as the unprivileged nginx user, so a symlink pointing
        # at something owned by somebody else (a container file, say) is not followed
        disable_symlinks if_not_owner from=$document_root;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # Prevent access to hidden files and directories
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Prevent access to backup files (editor leftovers, copies, droppings)
        location ~ (~|\.(bak|old|orig|save|swp|swo|tmp))$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Block common exploit attempts
        location ~* "(eval\(|base64_decode|gzip_inflate)" {
            deny all;
        }
        
        # Limit allowed file extensions (optional - comment out if too restrictive)
        # location ~ \.(php|py|sh|exe|bat|cmd)$ {
        #     deny all;
        # }
        
        # Default index files
        index index.html;
        
        location / {
            # nginx normalises the request path before matching it, so a '..'
            # cannot walk out of the document root
            try_files $uri $uri/ $uri/index.html =404;
        }
        
        # Cache static files. Neither location sets an add_header on purpose:
        # nginx discards every inherited add_header as soon as a location defines
        # one, which would silently drop the security headers set above.
        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
        }
        
        # Stylesheets and scripts are edited in place, so they must stay
        # revalidatable instead of being pinned in browsers for a year.
        location ~* \.(css|js)$ {
            expires 1h;
        }
    }
}
